<form id="contactForm">
    <label>Nom :</label><br>
    <input type="text" id="nom" required><br><br>

    <label>Email :</label><br>
    <input type="email" id="email" required><br><br>

    <label>Message :</label><br>
    <textarea id="message" required></textarea><br><br>

    <button type="button" onclick="sendMail()">Envoyer</button>
</form>

<script>
function sendMail() {
    const nom = document.getElementById("nom").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;

    const mailto = `mailto:Alexandre.savy@etu.univsmb.fr?subject=Message de ${nom}&body=Email : ${email}%0D%0A%0D%0A${encodeURIComponent(message)}`;
    
    window.location.href = mailto;
}
</script>
